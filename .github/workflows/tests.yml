name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pytest:
    # บอทพึ่ง pywin32/msvcrt (printing.py, singleton lock ใน bot.py) รันได้แค่บน Windows เท่านั้น
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # pipeline เสียงเรียก ffmpeg จริง (pitch shift / edge-tts adjust) — runner ไม่มีมาให้
      # ตั้งแต่ F5_THEN_RVC=False ขั้น _pitch_shift กลายเป็นขั้น *บังคับ* ของทุก segment
      # ถ้าไม่มี ffmpeg เทสจะวิ่งเข้า fallback path แทนพฤติกรรมจริงที่ตั้งใจทดสอบ
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        # ไม่มี Ollama บน runner — เทสทั้งหมดต้อง mock aiohttp.ClientSession เอง (ยืนยันแล้วว่า
        # รันผ่านครบ 292 เทสตอนปิด Ollama จริงบนเครื่อง dev ก่อน merge เวิร์กโฟลว์นี้)
        run: pytest -v
