[pytest]
# root ของโปรเจกต์อยู่บน sys.path เพื่อให้ test ใน tests/ ทำ "import bot" ได้
# (โมดูลหลักอยู่ root ไม่ใช่ package — pythonpath=. จึงจำเป็นหลังย้าย test เข้า tests/)
pythonpath = .

# รัน test เฉพาะใน tests/ — กัน pytest ไล่ collect เข้า venv/tools แล้ว crash
# (tools/test_gemini_tts.py เรียก argparse ตอน import → SystemExit ทำทั้ง session พัง)
testpaths = tests

# test_all_systems.py เป็น integration script ที่รันทุกอย่างระดับ module — แค่ pytest collect
# ก็ยิง HTTP จริง 9 ระบบทันที (เผา SerpApi quota 2 ครั้ง/รัน) และ sys.exit(1) ถ้าระบบภายนอกพัง
# → INTERNALERROR ทั้ง session เป็นครั้งคราว — ตัดออกจาก pytest เปล่า รันแยกเองตามที่ตั้งใจ:
#   python tests/test_all_systems.py
addopts = --ignore=tests/test_all_systems.py

# กันเผลอ recurse เข้าโฟลเดอร์หนัก/ไม่เกี่ยว แม้จะสั่ง pytest ชี้ path อื่น
norecursedirs = tools f5_venv rvc_venv chroma_db memory print_jobs karaoke voices logs f5_out rvc_out tts_raw tts_adjusted __pycache__ .git
